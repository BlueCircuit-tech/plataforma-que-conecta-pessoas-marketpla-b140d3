<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Conecta — Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:'#eef3ff',100:'#d9e3ff',200:'#b8caff',300:'#8aa8ff',
              400:'#5a82ff',500:'#2563EB',600:'#1d54c4',700:'#1E3A5F',
              800:'#15294a',900:'#0c1b32',950:'#06101d'
            },
            acento:'#F59E0B',
            base:'#F8FAFC'
          },
          fontFamily: { display:['"DM Serif Display"','Georgia','serif'], body:['"Source Sans 3"','system-ui','sans-serif'] },
          boxShadow: {
            'sm':'0 1px 3px rgba(30,58,95,.08)','card':'0 2px 8px rgba(30,58,95,.09)','card-hover':'0 6px 20px rgba(30,58,95,.14)',
            'nav':'0 -1px 3px rgba(30,58,95,.05)','float':'0 8px 30px rgba(30,58,95,.18)',
            'modal':'0 20px 60px rgba(6,16,29,.4)'
          },
          borderRadius: { '2xl':'1rem','3xl':'1.25rem' }
        }
      }
    }
  </script>
  <style>
    *{-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Source Sans 3',system-ui,sans-serif}
    body{background:linear-gradient(145deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center}

    .phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F8FAFC;border-radius:42px;box-shadow:0 0 0 7px #1a1a2e,0 0 0 9px #2d2d44,0 20px 60px rgba(0,0,0,.55),0 0 120px rgba(37,99,235,.08);flex-shrink:0}

    @media(max-width:430px){.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}

    .app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

    .statusbar{height:54px;padding:14px 28px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#1E3A5F;color:#fff;user-select:none}
    .statusbar time{font-size:15px;font-weight:700;letter-spacing:.5px}
    .status-icons{display:flex;align-items:center;gap:6px}
    @media(max-width:430px){.statusbar{border-radius:0}}

    @keyframes screenFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    [data-tela]{animation:screenFadeIn .25s ease-out}
    .screen-hidden{display:none!important;animation:none}

    .bottom-nav{height:64px;background:#fff;border-top:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-around;padding:0 2px;flex-shrink:0;box-shadow:0 -1px 3px rgba(30,58,95,.05);position:relative;z-index:50}
    .nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 4px;border:none;background:none;cursor:pointer;border-radius:12px;transition:all .2s ease;color:#94A3B8;min-width:52px;position:relative;flex-shrink:0}
    .nav-btn svg{transition:all .2s ease;width:22px;height:22px}
    .nav-btn span{font-size:10px;font-weight:600;font-family:'Source Sans 3',system-ui,sans-serif;transition:color .2s ease;white-space:nowrap;letter-spacing:.01em}
    .nav-btn:hover{color:#2563EB}
    .nav-btn.ativo{color:#2563EB}
    .nav-btn.ativo svg{transform:scale(1.1)}
    .nav-btn::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%) scaleX(0);width:28px;height:3px;background:#2563EB;border-radius:0 0 3px 3px;transition:transform .2s ease}
    .nav-btn.ativo::after{transform:translateX(-50%) scaleX(1)}

    .screen-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
    .screen-scroll::-webkit-scrollbar{width:3px}
    .screen-scroll::-webkit-scrollbar-track{background:transparent}
    .screen-scroll::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

    *:focus-visible{outline:2.5px solid #2563EB;outline-offset:2px;border-radius:6px}

    .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:700;font-family:'Source Sans 3',system-ui,sans-serif;line-height:1}
    .card{background:#fff;border-radius:1rem;box-shadow:0 2px 8px rgba(30,58,95,.09);overflow:hidden;transition:box-shadow .2s ease}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 24px;border-radius:12px;font-weight:600;font-size:14px;font-family:'Source Sans 3',system-ui,sans-serif;cursor:pointer;border:none;transition:all .2s ease;white-space:nowrap}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:#2563EB;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
    .btn-primary:hover{background:#1d54c4;box-shadow:0 4px 14px rgba(37,99,235,.4)}
    .btn-ghost{background:transparent;color:#2563EB;border:1.5px solid #2563EB}
    .btn-ghost:hover{background:#2563EB;color:#fff}

    .input-field{width:100%;padding:11px 16px;border:1.5px solid #CBD5E1;border-radius:12px;font-size:15px;font-family:'Source Sans 3',system-ui,sans-serif;background:#fff;transition:all .2s ease;color:#1E293B}
    .input-field:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none}

    #toast-box{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:350px;max-width:calc(100vw - 24px);pointer-events:none}
    @media(max-width:430px){#toast-box{width:calc(100vw - 16px);top:60px}}
    .toast-item{padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;font-family:'Source Sans 3',system-ui,sans-serif;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:auto;animation:toastIn .35s ease-out;backdrop-filter:blur(8px)}
    @keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-14px)}}
    .toast-ok{background:rgba(22,163,74,.95);color:#fff}
    .toast-erro{background:rgba(220,38,38,.95);color:#fff}
    .toast-info{background:rgba(30,58,95,.95);color:#fff}

    #modal-overlay{position:fixed;inset:0;background:rgba(6,16,29,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;backdrop-filter:blur(2px)}
    #modal-overlay.aberto{opacity:1;pointer-events:auto}
    @media(min-width:431px){#modal-overlay{align-items:center}}
    #modal-card{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:390px;max-height:70vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease}
    @media(min-width:431px){#modal-card{border-radius:20px;max-height:60vh}}
    #modal-overlay.aberto #modal-card{transform:translateY(0)}
    #modal-header{padding:18px 20px 14px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    #modal-header h3{font-family:'DM Serif Display',Georgia,serif;font-size:18px;color:#1E3A5F;margin:0}
    #modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#F1F5F9;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
    #modal-close:hover{background:#E2E8F0}
    #modal-body{padding:20px;overflow-y:auto;flex:1}
    #modal-body::-webkit-scrollbar{width:3px}
    #modal-body::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

    .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
    .avatar-lg{width:56px;height:56px;font-size:22px}
    .img-placeholder{border-radius:12px;background:linear-gradient(135deg,#1E3A5F 0%,#2563EB 100%);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-weight:600;font-size:13px;flex-shrink:0}

    .gradient-brand{background:linear-gradient(135deg,#1E3A5F 0%,#2563EB 100%)}

    .pulse{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body>
  <div class="phone" id="phone-frame">
    <div class="app" id="app">

      <!-- Status bar -->
      <div class="statusbar" id="statusbar">
        <time id="clock">09:41</time>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="4.5" y="5" width="3" height="7" rx=".5"/><rect x="9" y="2.5" width="3" height="9.5" rx=".5"/><rect x="13.5" y="0" width="3" height="12" rx=".5" opacity=".3"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.3C9.8 2.3 11.9 3.2 13.5 4.6L15 3.1C13 1.1 10.4 0 7.5 0S2 1.1 0 3.1L1.5 4.6C3.1 3.2 5.2 2.3 7.5 2.3zM7.5 5.3C9.1 5.3 10.5 6 11.5 7.1L13 5.6C11.5 4.1 9.6 3.3 7.5 3.3S3.5 4.1 2 5.6L3.5 7.1C4.5 6 5.9 5.3 7.5 5.3zM7.5 8.3C8.4 8.3 9.1 8.8 9.5 9.5L11 8C10.3 6.9 9 6.3 7.5 6.3S4.7 6.9 4 8L5.5 9.5C5.9 8.8 6.6 8.3 7.5 8.3z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="0" width="22" height="12" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="22" y="3.5" width="3" height="5" rx="1"/><rect x=".75" y="2.25" width="17" height="7.5" rx="1.5"/></svg>
        </div>
      </div>

      <!-- Main content -->
      <main class="screen-scroll" id="main-scroll">
        <!-- TELAS -->
      </main>

      <!-- Bottom navigation -->
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn" data-nav="vitrine" onclick="mostrarTela('vitrine')" aria-label="Vitrine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Vitrine</span>
        </button>
        <button class="nav-btn" data-nav="busca-e-filtros" onclick="mostrarTela('busca-e-filtros')" aria-label="Busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Busca</span>
        </button>
        <button class="nav-btn" data-nav="detalhe-do-anuncio" onclick="mostrarTela('detalhe-do-anuncio')" aria-label="Detalhes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Detalhe</span>
        </button>
        <button class="nav-btn" data-nav="meu-carrinho" onclick="mostrarTela('meu-carrinho')" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span>Carrinho</span>
        </button>
        <button class="nav-btn" data-nav="pagamento" onclick="mostrarTela('pagamento')" aria-label="Pagamento">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Pagamento</span>
        </button>
        <button class="nav-btn" data-nav="pedido-confirmado" onclick="mostrarTela('pedido-confirmado')" aria-label="Confirmado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Confirmado</span>
        </button>
        <button class="nav-btn" data-nav="meus-pedidos" onclick="mostrarTela('meus-pedidos')" aria-label="Pedidos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Pedidos</span>
        </button>
        <button class="nav-btn" data-nav="painel-do-anunciante" onclick="mostrarTela('painel-do-anunciante')" aria-label="Painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Painel</span>
        </button>
        <button class="nav-btn" data-nav="meus-anuncios" onclick="mostrarTela('meus-anuncios')" aria-label="Anúncios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Anúncios</span>
        </button>
        <button class="nav-btn" data-nav="administracao" onclick="mostrarTela('administracao')" aria-label="Admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Admin</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-box"></div>

  <!-- Modal -->
  <div id="modal-overlay" onclick="if(event.target===this)fecharModal()">
    <div id="modal-card">
      <div id="modal-header">
        <h3 id="modal-titulo"></h3>
        <button id="modal-close" onclick="fecharModal()" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // ---- Clock ----
    function tick(){
      const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
      const c=document.getElementById('clock');if(c)c.textContent=h+':'+m;
    }
    tick();setInterval(tick,15000);

    // ---- Currency / Date ----
    function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}
    function dataBR(iso){if(!iso)return'—';const d=iso.split('-');return d[2]+'/'+d[1]+'/'+d[0]}

    // ---- Toast ----
    function toast(msg,tipo){
      const box=document.getElementById('toast-box'),el=document.createElement('div');
      el.className='toast-item toast-'+tipo;
      const icones={ok:'✓',erro:'✕',info:'ℹ'};
      el.innerHTML='<span style="font-size:16px">'+icones[tipo]+'</span><span>'+msg+'</span>';
      box.appendChild(el);
      setTimeout(function(){el.style.animation='toastOut .3s ease-in forwards';setTimeout(function(){el.remove()},300)},3000);
    }

    // ---- Modal ----
    function abrirModal(html,titulo){
      document.getElementById('modal-titulo').textContent=titulo||'';
      document.getElementById('modal-body').innerHTML=html;
      document.getElementById('modal-overlay').classList.add('aberto');
    }
    function fecharModal(){document.getElementById('modal-overlay').classList.remove('aberto')}
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal()});

    // ---- Router ----
    function mostrarTela(id){
      document.querySelectorAll('[data-tela]').forEach(function(s){
        if(s.dataset.tela===id){s.classList.remove('screen-hidden');s.style.animation='none';s.offsetHeight;s.style.animation=''}
        else{s.classList.add('screen-hidden')}
      });
      document.querySelectorAll('[data-nav]').forEach(function(b){
        b.classList.toggle('ativo',b.dataset.nav===id);
      });
      const ms=document.getElementById('main-scroll');if(ms)ms.scrollTop=0;
    }
    document.addEventListener('DOMContentLoaded',function(){mostrarTela('vitrine')});
  </script>
</body>
</html>
